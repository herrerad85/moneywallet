name: connected

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  connected:
    runs-on: ubuntu-latest
    # Nobody watches a weekly job. Without this a wedged emulator burns the
    # default six hours before GitHub stops it.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # android-emulator-runner cannot start a hardware accelerated emulator on
      # ubuntu-latest until the runner user is allowed to open /dev/kvm.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: ./gradlew connectedFlossOsmDebugAndroidTest

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: connected-test-report
          path: app/build/reports/androidTests/connected/**
