name: build

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

# A force push should replace the run it supersedes, not queue behind it.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew clean testFlossOsmDebugUnitTest lintFlossOsmDebug assembleFlossOsmDebug

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-flossOsmDebug.html

      # The unit tests run before lint, so a failing test is the most common red
      # run and the one with no lint report to upload. Keep its own report.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testFlossOsmDebugUnitTest/**
            app/build/test-results/testFlossOsmDebugUnitTest/**

      - uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/flossOsm/debug/*.apk
